#cloud-config

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - nftables
  - wireguard

users:
  - default
  - name: __DOH_USER__
    gecos: Ephemeral router administrator
    groups:
      - sudo
    shell: /bin/bash
    lock_passwd: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - >-
          __DOH_SSH_PUBLIC_KEY__

ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/sysctl.d/90-doh-router.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.ip_forward = 1

  - path: /etc/nftables.conf
    owner: root:root
    permissions: "0644"
    content: |
      #!/usr/sbin/nft -f
      flush ruleset

      table inet doh_filter {
        chain forward {
          type filter hook forward priority filter; policy drop;
          iifname "wg0" oifname != "wg0" accept
          iifname != "wg0" oifname "wg0" ct state established,related accept
        }
      }

      table ip doh_nat {
        chain postrouting {
          type nat hook postrouting priority srcnat; policy accept;
          ip saddr 10.77.0.0/24 oifname != "wg0" masquerade
        }
      }

  - path: /usr/local/sbin/doh-configure-wireguard
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -o errexit
      set -o nounset
      set -o pipefail

      install -d -m 0700 /etc/wireguard
      umask 077

      if [[ ! -s /etc/wireguard/server.key ]]; then
        wg genkey >/etc/wireguard/server.key
      fi
      wg pubkey </etc/wireguard/server.key >/etc/wireguard/server.pub

      cat >/etc/wireguard/wg0.conf <<EOF
      [Interface]
      Address = 10.77.0.1/24
      ListenPort = __DOH_WG_PORT__
      PrivateKey = $(</etc/wireguard/server.key)

      [Peer]
      PublicKey = __DOH_CLIENT_PUBLIC_KEY__
      AllowedIPs = 10.77.0.2/32
      EOF

      chmod 0600 /etc/wireguard/server.key /etc/wireguard/wg0.conf
      chmod 0644 /etc/wireguard/server.pub

      sysctl --system
      systemctl enable --now nftables.service
      systemctl enable --now wg-quick@wg0.service

runcmd:
  - /usr/local/sbin/doh-configure-wireguard

final_message: "doh WireGuard router is ready after $UPTIME seconds"
