#cloud-config

package_update: true
package_upgrade: false

packages:
  - bat
  - build-essential
  - ca-certificates
  - curl
  - direnv
  - fd-find
  - fzf
  - git
  - jq
  - neovim
  - ripgrep
  - shellcheck
  - tmux
  - unzip
  - zip
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting

users:
  - default
  - name: __DOH_USER__
    gecos: Ephemeral development user
    groups:
      - sudo
    shell: /bin/bash
    lock_passwd: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - >-
          __DOH_SSH_PUBLIC_KEY__

ssh_pwauth: false
disable_root: true

write_files:
  - path: /usr/local/share/doh/zshrc
    owner: root:root
    permissions: "0644"
    content: |
      export ZSH="$HOME/.oh-my-zsh"
      ZSH_THEME=""
      plugins=(git)

      # Keep a large, shared and timestamped history across concurrent shells.
      HISTFILE="$HOME/.zsh_history"
      HISTSIZE=10000
      SAVEHIST=10000
      HIST_STAMPS="yyyy-mm-dd"

      if [[ -r "$ZSH/oh-my-zsh.sh" ]]; then
        source "$ZSH/oh-my-zsh.sh"
      fi

      # Apply these after Oh My Zsh so its defaults cannot override them.
      setopt APPEND_HISTORY
      setopt EXTENDED_HISTORY
      setopt HIST_EXPIRE_DUPS_FIRST
      setopt HIST_FCNTL_LOCK
      setopt HIST_FIND_NO_DUPS
      setopt HIST_IGNORE_ALL_DUPS
      setopt HIST_IGNORE_DUPS
      setopt HIST_IGNORE_SPACE
      setopt HIST_REDUCE_BLANKS
      setopt HIST_SAVE_NO_DUPS
      setopt SHARE_HISTORY

      # Interactive quality-of-life options.
      setopt AUTO_CD
      setopt AUTO_PUSHD
      setopt INTERACTIVE_COMMENTS
      setopt NO_BEEP
      setopt PUSHD_IGNORE_DUPS

      # Completion behavior and presentation.
      zstyle ':completion:*' menu select
      zstyle ':completion:*' group-name ''
      zstyle ':completion:*' matcher-list 'm:{a-zA-Z}={A-Za-z}' 'r:|=*' 'l:|=* r:|=*'
      zstyle ':completion:*:descriptions' format '%F{blue}-- %d --%f'
      zstyle ':completion:*:warnings' format '%F{red}No matches for: %d%f'
      zstyle ':completion:*' list-colors "${(s.:.)LS_COLORS}"

      # Catppuccin Macchiato fzf palette, matching the laptop.
      export FZF_DEFAULT_OPTS="${FZF_DEFAULT_OPTS:+$FZF_DEFAULT_OPTS }\
      --color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796 \
      --color=fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6 \
      --color=marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796 \
      --color=selected-bg:#494D64 \
      --color=border:#6E738D,label:#CAD3F5"

      if [[ -r /usr/share/doc/fzf/examples/key-bindings.zsh ]]; then
        source /usr/share/doc/fzf/examples/key-bindings.zsh
      fi
      if [[ -r /usr/share/doc/fzf/examples/completion.zsh ]]; then
        source /usr/share/doc/fzf/examples/completion.zsh
      fi

      ZSH_AUTOSUGGEST_STRATEGY=(history)
      ZSH_AUTOSUGGEST_HIGHLIGHT_STYLE='fg=#6e738d'
      if [[ -r /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh ]]; then
        source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
      fi

      if (( $+commands[starship] )); then
        eval "$(starship init zsh)"
      fi

      # Catppuccin Macchiato syntax-highlighting palette, matching the laptop.
      ZSH_HIGHLIGHT_HIGHLIGHTERS=(main cursor)
      typeset -gA ZSH_HIGHLIGHT_STYLES
      ZSH_HIGHLIGHT_STYLES[comment]='fg=#5b6078'
      ZSH_HIGHLIGHT_STYLES[alias]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[suffix-alias]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[global-alias]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[function]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[command]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[precommand]='fg=#a6da95,italic'
      ZSH_HIGHLIGHT_STYLES[autodirectory]='fg=#f5a97f,italic'
      ZSH_HIGHLIGHT_STYLES[single-hyphen-option]='fg=#f5a97f'
      ZSH_HIGHLIGHT_STYLES[double-hyphen-option]='fg=#f5a97f'
      ZSH_HIGHLIGHT_STYLES[back-quoted-argument]='fg=#c6a0f6'
      ZSH_HIGHLIGHT_STYLES[builtin]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[reserved-word]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[hashed-command]='fg=#a6da95'
      ZSH_HIGHLIGHT_STYLES[commandseparator]='fg=#ed8796'
      ZSH_HIGHLIGHT_STYLES[command-substitution-delimiter]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[process-substitution-delimiter]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[single-quoted-argument]='fg=#eed49f'
      ZSH_HIGHLIGHT_STYLES[single-quoted-argument-unclosed]='fg=#ee99a0'
      ZSH_HIGHLIGHT_STYLES[double-quoted-argument]='fg=#eed49f'
      ZSH_HIGHLIGHT_STYLES[double-quoted-argument-unclosed]='fg=#ee99a0'
      ZSH_HIGHLIGHT_STYLES[dollar-quoted-argument]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[dollar-quoted-argument-unclosed]='fg=#ee99a0'
      ZSH_HIGHLIGHT_STYLES[assign]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[unknown-token]='fg=#ee99a0'
      ZSH_HIGHLIGHT_STYLES[path]='fg=#cad3f5,underline'
      ZSH_HIGHLIGHT_STYLES[path_pathseparator]='fg=#ed8796,underline'
      ZSH_HIGHLIGHT_STYLES[path_prefix]='fg=#cad3f5,underline'
      ZSH_HIGHLIGHT_STYLES[globbing]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[history-expansion]='fg=#c6a0f6'
      ZSH_HIGHLIGHT_STYLES[redirection]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[arg0]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[default]='fg=#cad3f5'
      ZSH_HIGHLIGHT_STYLES[cursor]='fg=#cad3f5'

      alias cat='bat'
      alias catc='bat -pp'
      alias ga='git add'
      alias gc='git checkout'
      alias gd='git diff'
      alias gl='git log'
      alias gs='git status'
      alias gcl='git clone'
      alias gcb='git checkout -b'
      alias tml='tmux ls'
      alias tma='tmux attach -t'
      alias tms='tmux new -s'

      # zsh-syntax-highlighting must be sourced after every widget definition.
      if [[ -r /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh ]]; then
        source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
      fi

  - path: /usr/local/sbin/doh-install-development-tools
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -o errexit
      set -o nounset
      set -o pipefail

      user="__DOH_USER__"
      home="/home/$user"

      install -d -m 0755 -o "$user" -g "$user" "$home/src"
      install -m 0644 -o "$user" -g "$user" /usr/local/share/doh/zshrc "$home/.zshrc"
      ln -sfn /usr/bin/batcat /usr/local/bin/bat
      ln -sfn /usr/bin/fdfind /usr/local/bin/fd

      if [[ ! -d "$home/.oh-my-zsh" ]]; then
        sudo -u "$user" env HOME="$home" \
          git clone --depth 1 https://github.com/ohmyzsh/ohmyzsh.git "$home/.oh-my-zsh"
      fi

      starship_installer=$(mktemp)
      curl -fsSL https://starship.rs/install.sh -o "$starship_installer"
      sh "$starship_installer" --yes --bin-dir /usr/local/bin
      rm -f "$starship_installer"

      herdr_installer=$(mktemp)
      curl -fsSL https://herdr.dev/install.sh -o "$herdr_installer"
      chown "$user:$user" "$herdr_installer"
      chmod 0500 "$herdr_installer"
      sudo -u "$user" env HOME="$home" sh "$herdr_installer"
      rm -f "$herdr_installer"

      core_installer=$(mktemp)
      curl -fsSL https://releases.herdr.dev/core/install.sh -o "$core_installer"
      chown "$user:$user" "$core_installer"
      chmod 0500 "$core_installer"
      sudo -u "$user" env HOME="$home" sh "$core_installer"
      rm -f "$core_installer"

      for binary in herdr hc; do
        if [[ -x "$home/.local/bin/$binary" ]]; then
          ln -sfn "$home/.local/bin/$binary" "/usr/local/bin/$binary"
        fi
      done

      if ! grep -qxF 'eval "$(starship init bash)"' "$home/.bashrc"; then
        printf '\n%s\n' 'eval "$(starship init bash)"' >>"$home/.bashrc"
      fi
      chown "$user:$user" "$home/.bashrc"
      chsh -s /usr/bin/zsh "$user"

runcmd:
  - /usr/local/sbin/doh-install-development-tools

final_message: "doh development Droplet finished cloud-init after $UPTIME seconds"
